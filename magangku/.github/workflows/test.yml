name: Tes

# Menjalankan seluruh suite tes pada tiap push dan pull request.
# Tanpa ini, 93 tes yang ada hanya jalan kalau seseorang ingat mengetiknya.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Pasang dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: Jalankan tes
        run: python -m pytest tests/ -q

      - name: Pastikan pipeline offline tetap utuh
        # Menangkap kerusakan yang lolos dari unit test: alur nyata
        # scrape -> match harus jalan tanpa jaringan sama sekali.
        run: |
          python -m magangku.cli profile init --force
          python -m magangku.cli scrape --source fixtures
          python -m magangku.cli match --top 5
